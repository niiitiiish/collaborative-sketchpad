services:
  - type: web
    name: collaborative-sketchpad
    env: node
    buildCommand: |
      npm install
      cd client
      npm install
      npm run build
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: "0.0.0.0"
    healthCheckPath: /
    autoDeploy: true
    plan: free
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1 