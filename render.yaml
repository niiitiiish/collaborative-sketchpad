services:
  - type: web
    name: collaborative-sketchpad
    env: node
    buildCommand: |
      echo "Starting build process..."
      npm install
      echo "Installing client dependencies..."
      cd client
      npm install
      echo "Building client..."
      CI=false npm run build
      echo "Moving build files..."
      cp -r build ../client-build
      cd ..
      echo "Build process completed"
      echo "Listing files in root:"
      ls -la
      echo "Listing client-build:"
      ls -la client-build
    startCommand: |
      echo "Starting server..."
      echo "Current directory: $(pwd)"
      echo "Listing files:"
      ls -la
      echo "Listing client-build:"
      ls -la client-build
      node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: "production"
    healthCheckPath: /
    autoDeploy: true
    plan: free
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1 