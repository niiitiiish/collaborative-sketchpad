services:
  - type: web
    name: collaborative-sketchpad
    env: node
    buildCommand: |
      echo "Installing root dependencies..."
      npm install
      echo "Installing client dependencies..."
      cd client && npm install
      echo "Building client..."
      npm run build
      echo "Build complete"
      cd ..
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GENERATE_SOURCEMAP
        value: false
      - key: CORS_ORIGIN
        value: "*"
      - key: HOST
        value: "0.0.0.0"
    healthCheckPath: /
    autoDeploy: true
    plan: free
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1 