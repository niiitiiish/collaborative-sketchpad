services:
  - type: web
    name: collaborative-sketchpad
    env: node
    rootDir: .
    buildCommand: |
      echo "Installing root dependencies..."
      npm install
      echo "Installing client dependencies..."
      cd client
      npm install
      echo "Building client..."
      export GENERATE_SOURCEMAP=false
      npm run build
      echo "Build complete"
      cd ..
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GENERATE_SOURCEMAP
        value: false 