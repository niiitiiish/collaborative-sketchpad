services:
  - type: web
    name: collaborative-sketchpad
    env: node
    buildCommand: |
      echo "Starting build process..."
      npm install
      cd client
      npm install
      echo "Building client..."
      npm run build
      echo "Verifying build..."
      ls -la build/
      cd ..
      echo "Moving build to correct location..."
      mkdir -p client/build
      cp -r client/build/* client/build/
      echo "Verifying final build..."
      ls -la client/build/
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GENERATE_SOURCEMAP
        value: false
      - key: CORS_ORIGIN
        value: "*"
      - key: HOST
        value: "0.0.0.0"
    healthCheckPath: /
    autoDeploy: true
    plan: free
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1 