<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Sketchpad</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary-color: #00bcd4; /* Cyan 500 - vibrant blue */
            --primary-hover-color: #00acc1; /* Cyan 600 */
            --secondary-color: #673ab7; /* Deep Purple 500 - vibrant purple */
            --accent-color: #8bc34a; /* Light Green 500 - vibrant green */
            --background-light: #f8fafc; /* Slate-50 */
            --background-dark: #1a202c; /* Darker background for contrast */
            --surface-light: #ffffff; /* White for controls, cards */
            --surface-dark: #2d3748; /* Darker surface for controls, cards */
            --text-color-light: #2d3748; /* Dark text */
            --text-color-dark: #edf2f7; /* Light text */
            --border-color-light: #e2e8f0; /* Light border */
            --border-color-dark: #4a5568; /* Dark border */
            --shadow-light: 0 5px 15px rgba(0, 0, 0, 0.1);
            --shadow-dark: 0 5px 15px rgba(0, 0, 0, 0.3);
            --glass-blur: 10px;
            --glass-bg-light: rgba(255, 255, 255, 0.15);
            --glass-bg-dark: rgba(0, 0, 0, 0.25);
        }

        /* Global Styles & Resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, var(--background-light) 0%, #e0f2f7 100%); /* Subtle gradient */
            color: var(--text-color-light);
            transition: background 0.5s ease, color 0.3s ease;
        }

        /* Header/Top Toolbar */
        .header {
            padding: 15px 25px;
            background: var(--surface-light);
            box-shadow: var(--shadow-light);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .header-title {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group label {
            font-size: 0.95em;
            color: var(--text-color-light);
            white-space: nowrap;
        }

        /* Inputs */
        input[type="text"], input[type="number"], input[type="color"], select, textarea {
            padding: 10px 15px;
            font-size: 1em;
            border: 1px solid var(--border-color-light);
            border-radius: 8px;
            background: var(--surface-light);
            color: var(--text-color-light);
            transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease, box-shadow 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.25);
        }

        input[type="color"] {
            width: 45px;
            height: 45px;
            padding: 3px;
            cursor: pointer;
            border-radius: 8px;
        }

        /* Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100px;
            height: 10px;
            background: var(--border-color-light);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: grab;
            border: 3px solid var(--surface-light);
            box-shadow: var(--shadow-light);
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease, border-color 0.3s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.1);
            box-shadow: 0 0 0 5px rgba(0, 188, 212, 0.35);
        }

        /* Buttons */
        button {
            padding: 10px 20px;
            font-size: 1em;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: var(--primary-hover-color);
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        button.active {
            background: var(--secondary-color);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            transform: translateY(0);
        }

        /* Status Message */
        .status {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            flex-grow: 1;
            text-align: center;
            min-width: 200px;
            font-weight: 500;
            transition: background 0.3s ease, color 0.3s ease;
            background: var(--status-bg-info);
            color: var(--status-text-info);
        }

        .status.success {
            background: var(--status-bg-success);
            color: var(--status-text-success);
        }
        .status.error {
            background: var(--status-bg-error);
            color: var(--status-text-error);
        }
        .status.warning {
            background: #fff3cd; /* Yellow-100 */
            color: #856404; /* Yellow-800 */
        }

        /* Main Content Layout */
        .main-content {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Sidebar Styles (Left - Tools) */
        .sidebar.left {
            width: 250px;
            background: var(--surface-light);
            padding: 20px;
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            border-right: 1px solid var(--border-color-light);
        }

        .sidebar-section h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color-light);
            padding-bottom: 8px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .tool-grid button {
            min-width: unset;
            width: 100%;
        }

        /* Right Sidebar (Chat & Users) */
        .sidebar.right {
            width: 300px;
            background: var(--surface-light);
            padding: 20px;
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            border-left: 1px solid var(--border-color-light);
        }

        .user-list ul,
        .chat-messages ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .user-list li,
        .chat-messages li {
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color-light);
            font-size: 0.9em;
            color: var(--text-color-light);
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-input-group input {
            flex-grow: 1;
        }

        /* Canvas Area */
        .canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: var(--canvas-bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        #canvas {
            position: absolute;
            cursor: crosshair;
            touch-action: none;
            background: transparent; /* Canvas background handled by container */
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        /* On-Canvas Text Input */
        #textInput {
            position: absolute;
            border: 2px dashed var(--secondary-color);
            padding: 8px;
            font-family: inherit;
            font-size: 16px; /* Default, will be overridden by JS */
            line-height: 1.3;
            resize: none;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95); /* Slightly less transparent */
            color: var(--text-color-light);
            box-shadow: var(--shadow-light);
            z-index: 10;
            display: none;
            border-radius: 6px;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: var(--glass-bg-light);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            box-shadow: var(--shadow-light);
        }

        /* Responsive Adjustments */
        @media (max-width: 1024px) {
            .sidebar.left,
            .sidebar.right {
                width: 200px;
                padding: 15px;
            }
            .header {
                gap: 10px;
            }
            .header-title {
                font-size: 1.5em;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                padding: 10px;
                gap: 10px;
            }
            .main-content {
                flex-direction: column;
            }
            .sidebar.left,
            .sidebar.right {
                width: 100%;
                height: auto; /* Allow height to adjust */
                border-right: none;
                border-left: none;
                border-bottom: 1px solid var(--border-color-light);
                box-shadow: none;
            }
            .control-group {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }
            input[type="text"], input[type="number"], button, select {
                width: 100%;
            }
            input[type="range"] {
                width: 100%;
            }
            .status {
                margin-top: 5px;
                min-width: unset;
            }
            .tool-grid {
                grid-template-columns: repeat(3, 1fr); /* More columns for small screens */
            }
        }

        /* Dark Mode */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, var(--background-dark) 0%, #2a3b4c 100%);
                color: var(--text-color-dark);
            }
            .header {
                background: var(--surface-dark);
                box-shadow: var(--shadow-dark);
            }
            .header-title {
                color: var(--primary-color);
            }
            .control-group label {
                color: var(--text-color-dark);
            }
            input[type="text"], input[type="number"], input[type="color"], select, textarea {
                background: #3f516d; /* Darker input background */
                color: var(--text-color-dark);
                border-color: var(--border-color-dark);
            }
            input[type="range"]::-webkit-slider-thumb {
                border-color: var(--surface-dark);
            }
            button.active {
                background: var(--secondary-color);
                box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            }
            .status {
                background: #3f516d;
                color: var(--text-color-dark);
            }
            .canvas-container {
                background: var(--canvas-bg-dark);
            }
            #canvas {
                box-shadow: 0 0 20px rgba(0,0,0,0.3);
            }
            .sidebar.left,
            .sidebar.right {
                background: var(--surface-dark);
                box-shadow: var(--shadow-dark);
                border-color: var(--border-color-dark);
            }
            .sidebar-section h3 {
                border-color: var(--border-color-dark);
            }
            .user-list li,
            .chat-messages li {
                border-color: var(--border-color-dark);
            }
            .glass-panel {
                background: var(--glass-bg-dark);
                border: 1px solid rgba(255, 255, 255, 0.05);
                box-shadow: var(--shadow-dark);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">Super Sketchpad</div>
        
        <div class="control-group">
            <input type="text" id="username" placeholder="Your name" value="Guest">
            <input type="text" id="roomId" placeholder="Room ID" value="sketch_room">
            <button onclick="joinRoom()" id="joinRoomBtn">Join Room</button>
        </div>

        <div class="control-group">
            <div class="status" id="status">Not connected</div>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar left">
            <div class="sidebar-section tools-section">
                <h3>Tools</h3>
                <div class="tool-grid">
                    <button onclick="toggleTool('pen')" id="penBtn" class="active" title="Pen Tool">Pen</button>
                    <button onclick="toggleTool('eraser')" id="eraserBtn" title="Eraser Tool">Eraser</button>
                    <button onclick="toggleTool('line')" id="lineBtn" title="Line Tool">Line</button>
                    <button onclick="toggleTool('rectangle')" id="rectangleBtn" title="Rectangle Tool">Rect</button>
                    <button onclick="toggleTool('circle')" id="circleBtn" title="Circle Tool">Circle</button>
                    <button onclick="toggleTool('text')" id="textBtn" title="Text Tool">Text</button>
                </div>
            </div>

            <div class="sidebar-section properties-section">
                <h3>Properties</h3>
                <div class="control-group">
                    <label for="colorPicker">Color:</label>
                    <input type="color" id="colorPicker" value="#000000" title="Select Color">
                </div>
                <div class="control-group">
                    <label for="lineWidthSlider">Size:</label>
                    <input type="range" id="lineWidthSlider" min="1" max="50" value="2" title="Adjust Brush/Eraser Size">
                </div>
            </div>
            
            <div class="sidebar-section history-section">
                <h3>History</h3>
                <div class="control-group">
                    <button onclick="undo()" title="Undo Last Action">Undo</button>
                    <button onclick="redo()" title="Redo Last Action">Redo</button>
                </div>
            </div>

            <!-- Optional Layers Panel (UI Only for now) -->
            <div class="sidebar-section layers-section">
                <h3>Layers (UI)</h3>
                <ul id="layersList">
                    <li>Layer 1 (Active)</li>
                    <li>Layer 2</li>
                </ul>
                <div class="control-group">
                    <button>+ Add Layer</button>
                    <button>- Del Layer</button>
                </div>
            </div>

        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <textarea id="textInput" style="display: none;"></textarea>
        </div>

        <div class="sidebar right">
            <div class="sidebar-section user-section">
                <h3>Users</h3>
                <ul id="usersList">
                    <li><span style="color: var(--primary-color);">•</span> Guest (You)</li>
                </ul>
            </div>

            <div class="sidebar-section chat-section">
                <h3>Chat</h3>
                <div class="chat-messages" id="chatMessages">
                    <ul>
                        <li>Welcome to the Sketchpad!</li>
                    </ul>
                </div>
                <div class="chat-input-group">
                    <input type="text" id="chatInput" placeholder="Type a message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- DOM Elements ---
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const colorPicker = document.getElementById('colorPicker');
        const lineWidthSlider = document.getElementById('lineWidthSlider');
        const penBtn = document.getElementById('penBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const lineBtn = document.getElementById('lineBtn');
        const rectangleBtn = document.getElementById('rectangleBtn');
        const circleBtn = document.getElementById('circleBtn');
        const textBtn = document.getElementById('textBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const textInput = document.getElementById('textInput');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');
        const usersList = document.getElementById('usersList');

        // --- Drawing State Variables ---
        let isDrawing = false;
        let startPoint = { x: 0, y: 0 };
        let lastPoint = { x: 0, y: 0 }; 
        let currentRoom = null;
        let currentTool = 'pen';
        let currentColor = colorPicker.value;
        let currentLineWidth = parseInt(lineWidthSlider.value);
        let drawingHistory = [];
        let historyIndex = -1; 
        let currentStroke = null; // To group pen/eraser strokes

        // --- Canvas Initialization and Resizing ---
        function setCanvasStyles() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.font = '16px Inter, sans-serif'; 
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            const aspectRatio = 16/9; 
            let width = containerWidth;
            let height = containerWidth / aspectRatio;
            
            if (height > containerHeight) {
                height = containerHeight;
                width = containerHeight * aspectRatio;
            }
            
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            setCanvasStyles(); 
            redrawCanvas(); 
        }

        // --- Drawing History (Undo/Redo) ---

        function addDrawingToHistory(drawingData) {
            if (historyIndex < drawingHistory.length - 1) {
                drawingHistory = drawingHistory.slice(0, historyIndex + 1);
            }
            drawingHistory.push(drawingData);
            historyIndex++;
            // console.log('Added to history:', drawingData, 'New history size:', drawingHistory.length);
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
            
            drawingHistory.forEach(data => {
                applyDrawing(data);
            });
            toggleTool(currentTool, false); 
        }

        function undo() {
            if (historyIndex > -1) {
                historyIndex--;
                redrawCanvas();
                sendStatusMessage('Undo completed', 'info');
            } else {
                sendStatusMessage('Nothing to undo', 'warning');
            }
        }

        function redo() {
            if (historyIndex < drawingHistory.length - 1) {
                historyIndex++;
                redrawCanvas();
                sendStatusMessage('Redo completed', 'info');
            } else {
                sendStatusMessage('Nothing to redo', 'warning');
            }
        }

        // --- Tool Management ---

        function toggleTool(tool, updateButtonState = true) {
            currentTool = tool;
            hideTextInput(); 

            if (updateButtonState) {
                [penBtn, eraserBtn, lineBtn, rectangleBtn, circleBtn, textBtn].forEach(btn => {
                    btn.classList.remove('active');
                });
                const selectedBtn = document.getElementById(`${tool}Btn`);
                if (selectedBtn) {
                    selectedBtn.classList.add('active');
                }
            }

            // Reset drawing context for each tool
            ctx.globalCompositeOperation = 'source-over'; 
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor; 
            ctx.lineWidth = currentLineWidth;

            // Apply tool-specific settings
            switch (tool) {
                case 'eraser':
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = currentLineWidth * 2; 
                    break;
                case 'text':
                    // Text tool specific logic for input handling (handled in mousedown)
                    break;
            }
        }

        // --- Coordinate Handling ---

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // --- Drawing Logic (Mouse/Touch Events) ---

        function startDrawing(e) {
            e.preventDefault();
            hideTextInput(); 

            startPoint = getCoordinates(e);
            lastPoint = { ...startPoint }; 

            if (currentTool === 'text') {
                showTextInput(startPoint.x, startPoint.y);
                isDrawing = false; 
                return;
            }

            isDrawing = true;
            if (currentTool === 'pen' || currentTool === 'eraser') {
                currentStroke = {
                    tool: currentTool,
                    color: currentColor,
                    lineWidth: currentLineWidth,
                    points: [{ x: startPoint.x, y: startPoint.y }]
                };
                applyDrawing(currentStroke); // Draw the first point
            }
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const currentCoords = getCoordinates(e);

            if (currentTool === 'pen' || currentTool === 'eraser') {
                currentStroke.points.push({ x: currentCoords.x, y: currentCoords.y });
                
                ctx.beginPath();
                ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(currentCoords.x, currentCoords.y);
                ctx.globalCompositeOperation = (currentTool === 'eraser' ? 'destination-out' : 'source-over');
                ctx.strokeStyle = (currentTool === 'eraser' ? canvas.style.background : currentColor); 
                ctx.lineWidth = (currentTool === 'eraser' ? currentLineWidth * 2 : currentLineWidth);
                ctx.stroke();

                toggleTool(currentTool, false); 
            } else if (['line', 'rectangle', 'circle'].includes(currentTool)) {
                redrawCanvas(); 
                applyTemporaryShape(startPoint, currentCoords, currentTool, currentColor, currentLineWidth);
            }
            lastPoint = currentCoords;
        }

        function stopDrawing(e) {
            e.preventDefault();
            if (!isDrawing) return;
            isDrawing = false;
            const endPoint = getCoordinates(e);

            if (currentTool === 'pen' || currentTool === 'eraser') {
                addDrawingToHistory(currentStroke);
                if (currentRoom) {
                    socket.emit('draw', { roomId: currentRoom, data: currentStroke });
                }
                currentStroke = null; 
            } else if (['line', 'rectangle', 'circle'].includes(currentTool)) {
                const finalDrawingData = {
                    x1: startPoint.x,
                    y1: startPoint.y,
                    x2: endPoint.x,
                    y2: endPoint.y,
                    tool: currentTool,
                    color: currentColor,
                    lineWidth: currentLineWidth
                };
                addDrawingToHistory(finalDrawingData);
                redrawCanvas(); 
                if (currentRoom) {
                    socket.emit('draw', { roomId: currentRoom, data: finalDrawingData });
                }
            }
        }
        
        // --- Drawing Application (for history and received data) ---
        function applyDrawing(data) {
            const originalCompositeOperation = ctx.globalCompositeOperation;
            const originalLineWidth = ctx.lineWidth;
            const originalStrokeStyle = ctx.strokeStyle;
            const originalFillStyle = ctx.fillStyle;
            const originalFont = ctx.font;

            // Apply tool-specific settings
            if (data.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = data.lineWidth * 2;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = data.color;
                ctx.fillStyle = data.color;
                ctx.lineWidth = data.lineWidth;
            }

            // Draw based on tool type
            switch (data.tool) {
                case 'pen':
                case 'eraser':
                    if (data.points && data.points.length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(data.points[0].x, data.points[0].y);
                        for (let i = 1; i < data.points.length; i++) {
                            ctx.lineTo(data.points[i].x, data.points[i].y);
                        }
                        ctx.stroke();
                    } else if (data.x1 !== undefined) { 
                        ctx.beginPath();
                        ctx.moveTo(data.x1, data.y1);
                        ctx.lineTo(data.x2, data.y2);
                        ctx.stroke();
                    }
                    break;
                case 'line':
                    ctx.beginPath();
                    ctx.moveTo(data.x1, data.y1);
                    ctx.lineTo(data.x2, data.y2);
                    ctx.stroke();
                    break;
                case 'rectangle':
                    const rectX = Math.min(data.x1, data.x2);
                    const rectY = Math.min(data.y1, data.y2);
                    const rectWidth = Math.abs(data.x1 - data.x2);
                    const rectHeight = Math.abs(data.y1 - data.y2);
                    ctx.strokeRect(rectX, rectY, rectWidth, rectHeight);
                    break;
                case 'circle':
                    const centerX = (data.x1 + data.x2) / 2;
                    const centerY = (data.y1 + data.y2) / 2;
                    const radius = Math.sqrt(Math.pow(data.x2 - data.x1, 2) + Math.pow(data.y2 - data.y1, 2)) / 2;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                    break;
                case 'text':
                    ctx.font = data.font || '16px Inter, sans-serif'; 
                    ctx.fillStyle = data.fillStyle || '#000000'; 
                    ctx.fillText(data.text, data.x, data.y);
                    break;
            }

            // Restore original context settings
            ctx.globalCompositeOperation = originalCompositeOperation;
            ctx.lineWidth = originalLineWidth;
            ctx.strokeStyle = originalStrokeStyle;
            ctx.fillStyle = originalFillStyle;
            ctx.font = originalFont;
        }

        // For shapes, we draw a temporary preview without adding to history
        function applyTemporaryShape(start, end, tool, color, lineWidth) {
            const originalCompositeOperation = ctx.globalCompositeOperation;
            const originalLineWidth = ctx.lineWidth;
            const originalStrokeStyle = ctx.strokeStyle;
            const originalFillStyle = ctx.fillStyle;

            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = lineWidth;

            switch (tool) {
                case 'line':
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();
                    break;
                case 'rectangle':
                    const rectX = Math.min(start.x, end.x);
                    const rectY = Math.min(start.y, end.y);
                    const rectWidth = Math.abs(start.x - end.x);
                    const rectHeight = Math.abs(start.y - end.y);
                    ctx.strokeRect(rectX, rectY, rectWidth, rectHeight);
                    break;
                case 'circle':
                    const centerX = (start.x + end.x) / 2;
                    const centerY = (start.y + end.y) / 2;
                    const radius = Math.sqrt(Math.pow(end.x - start.x, 2) + Math.pow(end.y - start.y, 2)) / 2;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                    break;
            }
            // Restore original context settings
            ctx.globalCompositeOperation = originalCompositeOperation;
            ctx.lineWidth = originalLineWidth;
            ctx.strokeStyle = originalStrokeStyle;
            ctx.fillStyle = originalFillStyle;
        }

        // --- Text Input Management ---
        function showTextInput(x, y) {
            textInput.style.display = 'block';
            // Position the textarea relative to the canvas display size
            const canvasRect = canvas.getBoundingClientRect();

            // Scale back from canvas drawing coordinates (x,y) to CSS display coordinates for textarea positioning
            const displayX = x / (canvas.width / canvasRect.width);
            const displayY = y / (canvas.height / canvasRect.height);
            
            textInput.style.left = `${displayX}px`;
            textInput.style.top = `${displayY}px`;

            textInput.style.font = ctx.font;
            textInput.style.color = currentColor;
            textInput.style.width = 'auto'; 
            textInput.style.height = 'auto'; 
            textInput.value = '';
            textInput.focus();

            textInput.onblur = commitText;
            textInput.onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { 
                    e.preventDefault();
                    commitText();
                }
            };

            textInput.oninput = () => {
                textInput.style.height = 'auto';
                textInput.style.height = textInput.scrollHeight + 'px';
                textInput.style.width = 'auto';
                textInput.style.width = textInput.scrollWidth + 'px';
            };
        }

        function hideTextInput() {
            textInput.style.display = 'none';
            textInput.onblur = null;
            textInput.onkeydown = null;
            textInput.oninput = null;
        }

        function commitText() {
            const text = textInput.value.trim();
            if (text) {
                // Convert textarea's CSS position (relative to canvas display size) back to canvas drawing coordinates
                const canvasX = parseFloat(textInput.style.left) * (canvas.width / parseFloat(canvas.style.width));
                const canvasY = parseFloat(textInput.style.top) * (canvas.height / parseFloat(canvas.style.height));

                const textData = {
                    x: canvasX,
                    y: canvasY,
                    text: text,
                    font: ctx.font, 
                    fillStyle: currentColor, 
                    tool: 'text'
                };
                applyDrawing(textData);
                addDrawingToHistory(textData);
                if (currentRoom) {
                    socket.emit('draw', { roomId: currentRoom, data: textData });
                }
            }
            hideTextInput();
            toggleTool('pen'); 
        }

        // --- Event Listeners (Canvas, Tools, Sliders) ---
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing); 

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        colorPicker.addEventListener('change', (e) => {
            currentColor = e.target.value;
            toggleTool(currentTool, false); 
        });

        lineWidthSlider.addEventListener('input', (e) => {
            currentLineWidth = parseInt(e.target.value);
            toggleTool(currentTool, false); 
        });

        // --- Socket Events ---
        socket.on('connect', () => {
            sendStatusMessage('Connected to server', 'success');
            joinRoomBtn.disabled = false;
        });

        socket.on('connect_error', (error) => {
            console.error('Socket connection error:', error);
            sendStatusMessage(`Connection error: ${error.message}. Try refreshing.`, 'error');
            joinRoomBtn.disabled = true;
        });

        socket.on('disconnect', () => {
            sendStatusMessage('Disconnected from server', 'error');
            joinRoomBtn.disabled = false;
        });

        socket.on('draw', (data) => {
            applyDrawing(data);
            addDrawingToHistory(data); 
        });

        socket.on('userJoined', ({ users }) => {
            // Update user list UI
            usersList.innerHTML = ''; // Clear existing list
            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user.username + (user.id === socket.id ? ' (You)' : '');
                usersList.appendChild(li);
            });
            sendStatusMessage(`${users.length} user(s) in room`, 'info');
            redrawCanvas(); // Request a full redraw to get consistent state
        });

        socket.on('chatMessage', ({ username, message }) => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${username}:</strong> ${message}`;
            chatMessages.querySelector('ul').appendChild(li);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to bottom
        });

        // --- Room Management ---
        function joinRoom() {
            const username = document.getElementById('username').value.trim();
            const roomId = document.getElementById('roomId').value.trim();
            if (username && roomId) {
                currentRoom = roomId;
                socket.emit('joinRoom', { roomId, username });
                sendStatusMessage(`Joined room: ${roomId} as ${username}`, 'success');
                drawingHistory = []; 
                historyIndex = -1;
                redrawCanvas(); // Clear local canvas effectively for new room
                chatMessages.querySelector('ul').innerHTML = '<li>Welcome to the Sketchpad!</li>'; // Clear chat
            } else {
                sendStatusMessage('Please enter a username and room ID.', 'warning');
            }
        }

        // --- Chat Functions ---
        function sendMessage() {
            const message = chatInput.value.trim();
            if (message && currentRoom) {
                socket.emit('sendMessage', { roomId: currentRoom, message });
                chatInput.value = ''; // Clear input
            } else if (!currentRoom) {
                sendStatusMessage('Please join a room to chat.', 'warning');
            }
        }

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // --- Utility Functions ---
        function sendStatusMessage(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        // --- Initial Setup ---
        // Ensure default values are set in inputs
        document.getElementById('username').value = 'Guest';
        document.getElementById('roomId').value = 'sketch_room';

        resizeCanvas(); 
        // window.addEventListener('resize', resizeCanvas); // Already added inside resizeCanvas itself
        toggleTool(currentTool); 
        setCanvasStyles(); 
    </script>
</body>
