<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Sketchpad</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2c3e50;
            --background-color: #f5f6fa;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .join-form {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .join-form input {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
        }

        .join-form button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background 0.3s;
        }

        .join-form button:hover {
            background: #357abd;
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 1rem;
            padding: 1rem;
            height: calc(100vh - 80px);
        }

        .canvas-container {
            flex: 1;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        .tools {
            width: 60px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .tool-btn:hover {
            background: #e9ecef;
        }

        .tool-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .chat-container {
            width: 300px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .message {
            max-width: 80%;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
        }

        .message.other {
            align-self: flex-start;
            background: #e9ecef;
        }

        .message.system {
            align-self: center;
            background: #f8f9fa;
            font-style: italic;
            font-size: 0.8rem;
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
        }

        .chat-input button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-input button:hover {
            background: #357abd;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            padding: 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .size-slider {
            width: 100%;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .tools {
                width: 100%;
                flex-direction: row;
                justify-content: center;
            }

            .chat-container {
                width: 100%;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Collaborative Sketchpad</h1>
        <div class="join-form">
            <input type="text" id="username" placeholder="Your name" maxlength="20">
            <input type="text" id="roomId" placeholder="Room ID" maxlength="20">
            <button onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <div class="main-content">
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
        <div class="tools">
            <button class="tool-btn active" onclick="setTool('pen')" title="Pen">✏️</button>
            <button class="tool-btn" onclick="setTool('eraser')" title="Eraser">🧹</button>
            <input type="color" class="color-picker" id="colorPicker" value="#000000" title="Color">
            <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="5" title="Size">
            <button class="tool-btn" onclick="undo()" title="Undo">↩️</button>
            <button class="tool-btn" onclick="redo()" title="Redo">↪️</button>
        </div>
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentTool = 'pen';
        let currentColor = '#000000';
        let currentSize = 5;
        let currentRoom = null;
        let currentUsername = null;
        let drawingHistory = [];
        let historyIndex = -1;
        let currentStroke = null; // To group pen/eraser strokes

        // Set canvas size
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            redrawCanvas(); // Redraw canvas on resize to maintain content
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Drawing history functions
        function addDrawingToHistory(drawingData) {
            if (historyIndex < drawingHistory.length - 1) {
                drawingHistory = drawingHistory.slice(0, historyIndex + 1);
            }
            drawingHistory.push(drawingData);
            historyIndex++;
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear entire canvas
            for (let i = 0; i <= historyIndex; i++) {
                applyDrawing(drawingHistory[i]);
            }
        }

        function undo() {
            if (historyIndex > -1) {
                historyIndex--;
                redrawCanvas();
            }
        }

        function redo() {
            if (historyIndex < drawingHistory.length - 1) {
                historyIndex++;
                redrawCanvas();
            }
        }

        // Drawing functions
        function startDrawing(e) {
            isDrawing = true;
            const { x, y } = getCoordinates(e);
            currentStroke = {
                tool: currentTool,
                color: currentColor,
                size: currentSize,
                points: [{ x, y }]
            };
            ctx.beginPath();
            ctx.moveTo(x, y);
            draw(e); // Draw the first point
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.beginPath(); // End the current path
            if (currentStroke) {
                addDrawingToHistory(currentStroke);
                // Send drawing data to server
                if (currentRoom) {
                    socket.emit('draw', {
                        roomId: currentRoom,
                        data: currentStroke
                    });
                }
                currentStroke = null;
            }
        }

        function draw(e) {
            if (!isDrawing) return;

            const { x, y } = getCoordinates(e);

            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            if (currentStroke) {
                currentStroke.points.push({ x, y });
            }
        }

        function applyDrawing(data) {
            const originalCompositeOperation = ctx.globalCompositeOperation;
            const originalLineWidth = ctx.lineWidth;
            const originalStrokeStyle = ctx.strokeStyle;

            ctx.lineWidth = data.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (data.tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = data.color;
            }

            if (data.points && data.points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(data.points[0].x, data.points[0].y);
                for (let i = 1; i < data.points.length; i++) {
                    ctx.lineTo(data.points[i].x, data.points[i].y);
                }
                ctx.stroke();
            }

            // Restore original context settings
            ctx.globalCompositeOperation = originalCompositeOperation;
            ctx.lineWidth = originalLineWidth;
            ctx.strokeStyle = originalStrokeStyle;
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Tool functions
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function setColor(color) {
            currentColor = color;
        }

        function setSize(size) {
            currentSize = size;
        }

        // Room functions
        function joinRoom() {
            const username = document.getElementById('username').value.trim();
            const roomId = document.getElementById('roomId').value.trim();

            if (!username || !roomId) {
                alert('Please enter both username and room ID');
                return;
            }

            currentUsername = username;
            currentRoom = roomId;

            socket.emit('joinRoom', { roomId, username });
            addSystemMessage(`Joined room: ${roomId}`);
        }

        // Chat functions
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (message && currentRoom && currentUsername) {
                socket.emit('chatMessage', {
                    roomId: currentRoom,
                    message,
                    username: currentUsername
                });
                messageInput.value = '';
            }
        }

        function addMessage(message, type = 'other') {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', type);
            
            if (type === 'system') {
                messageElement.textContent = message;
            } else {
                messageElement.innerHTML = `
                    <strong>${message.username}</strong>
                    <p>${message.message}</p>
                `;
            }

            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(message) {
            addMessage(message, 'system');
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch event listeners for drawing
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        document.getElementById('colorPicker').addEventListener('change', (e) => setColor(e.target.value));
        document.getElementById('sizeSlider').addEventListener('input', (e) => setSize(e.target.value));
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Socket event handlers
        socket.on('draw', (data) => {
            addDrawingToHistory(data);
            redrawCanvas(); // Redraw canvas to apply new drawing
        });

        socket.on('userJoined', ({ id, username }) => {
            addSystemMessage(`${username} joined the room`);
        });

        socket.on('userLeft', ({ id, username }) => {
            addSystemMessage(`${username} left the room`);
        });

        socket.on('chatMessage', (message) => {
            addMessage(message, message.id === socket.id ? 'user' : 'other');
        });

        socket.on('connect_error', (error) => {
            console.error('Connection error:', error);
            addSystemMessage('Connection error. Please try again.');
        });
    </script>
</body>
</html>
